services:
  devbox:
    image: ghcr.io/YOUR_GITHUB_USERNAME/nas-devbox-image:latest
    container_name: devbox
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:2222:2222"
    environment:
      TZ: Europe/Berlin
      AUTHORIZED_KEYS: ""
    volumes:
      - /srv/devbox/home:/home/dev
      - /srv/devbox/workspace:/workspace
      - /srv/devbox/ssh-host-keys:/ssh-host-keys
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    tmpfs:
      - /run
      - /tmp
    mem_limit: 4g
    pids_limit: 512
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/sshd -t && pgrep -x sshd >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
