[tui]
# Only notify when Codex needs input
notifications = ["approval-requested"]
notification_method = "bel"

# Codex finished -> ntfy
notify = ["sh", "-c", "curl -fsS \
  -H \"Authorization: Bearer $NTFY_TOKEN\" \
  -H \"Title: Codex done\" \
  -H \"Priority: default\" \
  -H \"Tags: white_check_mark,robot\" \
  -d \"Codex finished a turn\" \
  ${NTFY_BASE_URL}/up-codex-done >/dev/null || true", "agent-turn-complete"]
